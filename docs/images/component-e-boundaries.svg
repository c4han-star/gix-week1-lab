<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <title>Component E  boundaries and errors</title>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Component E  data flow + risks at each boundary</text>
  <rect x="40" y="55" width="160" height="70" rx="8" fill="#ffffff" stroke="#111"/>
  <text x="120" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600">User</text>
  <text x="120" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">clicks, filter</text>
  <rect x="260" y="55" width="180" height="70" rx="8" fill="#ffffff" stroke="#111"/>
  <text x="350" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600">React UI</text>
  <text x="350" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">/events page</text>
  <rect x="500" y="55" width="180" height="70" rx="8" fill="#ffffff" stroke="#111"/>
  <text x="590" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600">GET /api/events</text>
  <text x="590" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">JSON handler</text>
  <rect x="260" y="200" width="420" height="90" rx="8" fill="#ffffff" stroke="#111"/>
  <text x="470" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Supabase PostgreSQL  public.events</text>
  <text x="470" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10">rows: id, title, category, starts_at, &</text>
  <path d="M 120 125 L 120 170 L 350 170 L 350 125" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="165" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb">UI actions</text>
  <text x="185" y="180" font-family="system-ui,sans-serif" font-size="9" fill="#b91c1c">err: bad input</text>
  <path d="M 440 125 L 500 125" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="118" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb">HTTP GET</text>
  <text x="455" y="138" font-family="system-ui,sans-serif" font-size="9" fill="#b91c1c">err: 503 no env</text>
  <path d="M 590 125 L 590 195" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="165" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb">SQL select</text>
  <text x="600" y="178" font-family="system-ui,sans-serif" font-size="9" fill="#b91c1c">err: RLS / timeout</text>
  <rect x="40" y="330" width="640" height="70" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Each red label = one plausible failure mode at that boundary (see docs/architecture.md table).</text>
</svg>
